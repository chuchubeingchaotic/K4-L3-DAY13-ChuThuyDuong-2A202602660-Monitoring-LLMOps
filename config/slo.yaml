service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Dựa trên baseline đo được từ load test (P95 latency xấp xỉ 500-1200ms, không có request lỗi), ngưỡng 3000ms là an toàn để đảm bảo SLA cho người dùng. Với lưu lượng ước tính 10.000 requests trong chu kỳ 28 ngày, error budget 0.5% tương đương tối đa 50 requests được phép không đạt SLO (bị chậm >3000ms hoặc lỗi).
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90

